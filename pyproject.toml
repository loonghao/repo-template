[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "your-project-name"
version = "0.0.1"
description = "Your project description"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "your_project_name", from = "src"}]
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[tool.poetry.dependencies]
python = ">=3.7,<4.0"
loguru = ">=0.7.3,<0.8.0"
platformdirs = ">=3,<4.0.0"
# 1.10.25 dropped the cp37 wheels, so pin the 3.7 branch to the last release that
# still ships one and keep the rest of the range on the newest 1.10.x.
pydantic = [
    { version = ">=1.10.0,<1.10.25", markers = "python_version < '3.8'" },
    { version = ">=1.10.0,<2.0.0", markers = "python_version >= '3.8'" },
]

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
# commitizen >=3.10.0 requires Python >=3.8, so it must stay out of the 3.7
# solve. Markers, not `python`, for the poetry 1.x reason given above.
commitizen = { version = "^3.12.0", markers = "python_version >= '3.8'" }
ruff = "^0.9.0"
pyfakefs = "^5.8.0"
# 8.1.0+ requires pydantic>=2, which conflicts with the pydantic<2 runtime pin
# this template ships with. 8.0.x is the last line that accepts pydantic <2,>=1.10.2.
python-semantic-release = ">=8.0.0,<8.1.0"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
# Expressed as `markers` rather than the `python` property: poetry 1.x, which
# uvx still installs on the Python 3.7/3.8 legs, does not propagate a direct
# dependency's `python` restriction to its own transitive requirements.
#
# sphinx >=7.2.6 requires Python >=3.9, and sphinx-rtd-theme and myst-parser
# both depend on sphinx unconditionally, so the whole docs stack shares that
# >=3.9 floor rather than myst-parser's own >=3.8.
sphinx = { version = "^7.2.6", markers = "python_version >= '3.9'" }
sphinx-rtd-theme = { version = "^2.0.0", markers = "python_version >= '3.9'" }
myst-parser = { version = "^2.0.0", markers = "python_version >= '3.9'" }
# Declared explicitly because poetry 1.x otherwise still resolves
# markdown-it-py (pulled in by myst-parser and requiring Python >=3.8)
# against the full >=3.7 range and fails the 3.7/3.8 legs.
markdown-it-py = { version = ">=3.0,<4.0", markers = "python_version >= '3.9'" }

[tool.poetry.urls]
Homepage = "https://github.com/yourusername/your-project-name"
Issues = "https://github.com/yourusername/your-project-name/issues"

[tool.poetry.scripts]
your-project-name = "your_project_name.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["your_project_name"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.7"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
ignore_missing_imports = true
disable_error_code = ["type-arg", "misc", "no-any-return"]

[tool.ruff]
line-length = 120
target-version = "py37"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", # pycodestyle
    "F", # pyflakes
    "D", # pydocstyle
    "UP", # pyupgrade
    "RUF", # ruff-specific rules
]
ignore = ["D203", "D213", "ARG001", "D107", "D105", "D102", "F811", "I001"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*.py" = ["ARG001", "F401", "F811", "D107", "D105", "D102", "E501", "I001"]
"nox_actions/*.py" = ["D100", "D103", "D104", "E402"]
"noxfile.py" = ["D100", "E402", "D401", "D400"]
"examples/*.py" = ["D401", "D415", "RUF013", "E722", "D400"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.isort]
# Enforce import section headers.
import_heading_future = "Import future modules"
import_heading_stdlib = "Import built-in modules"
import_heading_thirdparty = "Import third-party modules"
import_heading_firstparty = "Import local modules"
import_heading_localfolder = "Import local modules"

profile = "black"
line_length = 120
force_sort_within_sections = true
force_single_line = true
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
known_first_party = ["your_project_name"]

[tool.nox]
sessions = ["lint", "pytest"]
python = ["3.7", "3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
reuse_venv = true

[tool.nox.session.lint]
deps = ["ruff", "mypy", "isort"]
commands = [
    "mypy --install-types --non-interactive",
    "ruff check .",
    "ruff format --check .",
    "isort --check-only .",
    "mypy src/your_project_name --strict"
]

[tool.nox.session.lint_fix]
deps = ["ruff", "mypy", "isort"]
commands = [
    "ruff check --fix .",
    "ruff format .",
    "isort ."
]

[tool.nox.session.pytest]
deps = ["pytest", "pytest-cov"]
commands = [
    "pytest tests/ --cov=your_project_name --cov-report=xml:coverage.xml --cov-report=term-missing"
]

[tool.semantic_release]
version_variable = [
    "src/your_project_name/__version__.py:__version__",
    "pyproject.toml:version"
]
branch = "main"
upload_to_pypi = false
upload_to_release = true
build_command = "pip install poetry && poetry build"
